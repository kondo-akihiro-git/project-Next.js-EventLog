version: "3.9"

services:
  db:
    image: postgres:16
    container_name: meetup-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meetuplog
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: meetuplog-web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/meetuplog
    depends_on:
      - db

volumes:
  db_data: